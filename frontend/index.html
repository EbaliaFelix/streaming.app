<!doctype html>
<html lang="es">

<head>

	<meta charset="UTF-8" />

	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Catálogo de Películas</title>

	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
		rel="stylesheet"
	/>

	<link rel="stylesheet" href="css/style.css" />

</head>

<body>

	<!-- LOGIN -->

	<div class="container mt-4" id="login-section">

		<h2>Login</h2>

		<form id="login-form">

			<div class="mb-3">

				<label for="username" class="form-label">
					Usuario
				</label>

				<input
					type="text"
					class="form-control"
					id="username"
					required
				/>

			</div>

			<div class="mb-3">

				<label for="password" class="form-label">
					Contraseña
				</label>

				<input
					type="password"
					class="form-control"
					id="password"
					required
				/>

			</div>

			<button type="submit" class="btn btn-primary">
				Ingresar
			</button>

		</form>

	</div>


	<!-- APP -->

	<div class="container mt-4 d-none" id="app-section">

		<nav class="navbar navbar-expand-lg custom-navbar mb-4">

			<div class="container-fluid">

				<a class="navbar-brand" href="#">
					Películas
				</a>

				<div class="collapse navbar-collapse">

					<ul class="navbar-nav me-auto">

						<li class="nav-item">

							<a
								id="btn-create"
								class="nav-link"
								href="#"
								onclick="showSection('create')"
							>
								Agregar
							</a>

						</li>

						<li class="nav-item">

							<a
								class="nav-link"
								href="#"
								onclick="showSection('read')"
							>
								Ver
							</a>

						</li>

						<li class="nav-item">

							<a
								id="btn-update"
								class="nav-link"
								href="#"
								onclick="showSection('update')"
							>
								Editar
							</a>

						</li>

						<li class="nav-item">

							<a
								id="btn-delete"
								class="nav-link"
								href="#"
								onclick="showSection('delete')"
							>
								Eliminar
							</a>

						</li>

					</ul>


					<!-- BOTONES DERECHA -->

					<div class="d-flex align-items-center gap-2">

						<button
							class="btn btn-outline-light"
							onclick="document.body.classList.toggle('light-mode')"
						>
							🌙 ☀
						</button>

						<button
							class="btn btn-outline-danger"
							onclick="logout()"
						>
							Logout
						</button>

					</div>

				</div>

			</div>

		</nav>


		<!-- CRUD -->

		<div id="crud-section">


			<!-- AGREGAR -->

			<div id="create" class="d-none">

				<h3>Agregar Película</h3>

				<form onsubmit="addMovie(event)">

					<input
						type="text"
						id="new-title"
						class="form-control mb-2"
						placeholder="Título"
						required
					/>

					<input
						type="text"
						id="new-director"
						class="form-control mb-2"
						placeholder="Director"
						required
					/>

					<button type="submit" class="btn btn-success">
						Guardar
					</button>

				</form>

			</div>


			<!-- VER -->

			<div id="read" class="d-none">

				<h3>Listado de Películas</h3>

				<div id="movie-list" class="row"></div>

			</div>


			<!-- EDITAR -->

			<div id="update" class="d-none">

				<h3>Editar Película</h3>

				<form onsubmit="updateMovie(event)">

					<input
						type="number"
						id="edit-index"
						class="form-control mb-2"
						placeholder="ID"
						required
					/>

					<input
						type="text"
						id="edit-title"
						class="form-control mb-2"
						placeholder="Nuevo Título"
						required
					/>

					<input
						type="text"
						id="edit-director"
						class="form-control mb-2"
						placeholder="Nuevo Director"
						required
					/>

					<button type="submit" class="btn btn-warning">
						Actualizar
					</button>

				</form>

			</div>


			<!-- ELIMINAR -->

			<div id="delete" class="d-none">

				<h3>Eliminar Película</h3>

				<form onsubmit="deleteMovie(event)">

					<input
						type="number"
						id="delete-index"
						class="form-control mb-2"
						placeholder="ID"
						required
					/>

					<button type="submit" class="btn btn-danger">
						Eliminar
					</button>

				</form>

			</div>

		</div>

	</div>


	<!-- SCRIPTS -->

	<script src="js/main.js"></script>

	<script src="js/ui.js"></script>

</body>

</html>
