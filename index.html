<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Películas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-4" id="login-section">
    <h2>Login</h2>
    <form id="login-form">
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="username" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
  </div>

  <div class="container mt-4 d-none" id="app-section">
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Películas</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('create')">Agregar</a></li>
            <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('read')">Ver</a></li>
            <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('update')">Editar</a></li>
            <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('delete')">Eliminar</a></li>
          </ul>
          <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
        </div>
      </div>
    </nav>

    <div id="crud-section">
      <!-- Sección de Agregar -->
      <div id="create" class="d-none">
        <h3>Agregar Película</h3>
        <form onsubmit="addMovie(event)">
          <input type="text" id="new-title" class="form-control mb-2" placeholder="Título" required />
          <input type="text" id="new-director" class="form-control mb-2" placeholder="Director" required />
          <button type="submit" class="btn btn-success">Guardar</button>
        </form>
      </div>

      <!-- Sección de Ver -->
      <div id="read" class="d-none">
        <h3>Listado de Películas</h3>
        <ul id="movie-list" class="list-group"></ul>
      </div>

      <!-- Sección de Editar -->
      <div id="update" class="d-none">
        <h3>Editar Película</h3>
        <form onsubmit="updateMovie(event)">
          <input type="number" id="edit-index" class="form-control mb-2" placeholder="Índice" required />
          <input type="text" id="edit-title" class="form-control mb-2" placeholder="Nuevo Título" required />
          <input type="text" id="edit-director" class="form-control mb-2" placeholder="Nuevo Director" required />
          <button type="submit" class="btn btn-warning">Actualizar</button>
        </form>
      </div>

      <!-- Sección de Eliminar -->
      <div id="delete" class="d-none">
        <h3>Eliminar Película</h3>
        <form onsubmit="deleteMovie(event)">
          <input type="number" id="delete-index" class="form-control mb-2" placeholder="Índice" required />
          <button type="submit" class="btn btn-danger">Eliminar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let movies = [];

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (user === "admin" && pass === "1234") {
        document.getElementById("login-section").classList.add("d-none");
        document.getElementById("app-section").classList.remove("d-none");
        showSection("read");
      } else {
        alert("Credenciales incorrectas");
      }
    });

    function logout() {
      document.getElementById("app-section").classList.add("d-none");
      document.getElementById("login-section").classList.remove("d-none");
    }

    function showSection(sectionId) {
      ["create", "read", "update", "delete"].forEach(id => {
        document.getElementById(id).classList.add("d-none");
      });
      document.getElementById(sectionId).classList.remove("d-none");
      if (sectionId === "read") renderMovies();
    }

    function addMovie(e) {
      e.preventDefault();
      const title = document.getElementById("new-title").value;
      const director = document.getElementById("new-director").value;
      movies.push({ title, director });
      document.getElementById("new-title").value = "";
      document.getElementById("new-director").value = "";
      alert("Película agregada");
    }

    function renderMovies() {
      const list = document.getElementById("movie-list");
      list.innerHTML = "";
      movies.forEach((movie, index) => {
        const item = document.createElement("li");
        item.className = "list-group-item";
        item.textContent = `${index}: ${movie.title} - ${movie.director}`;
        list.appendChild(item);
      });
    }

    function updateMovie(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById("edit-index").value);
      const title = document.getElementById("edit-title").value;
      const director = document.getElementById("edit-director").value;
      if (movies[index]) {
        movies[index] = { title, director };
        alert("Película actualizada");
      } else {
        alert("Índice inválido");
      }
    }

    function deleteMovie(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById("delete-index").value);
      if (movies[index]) {
        movies.splice(index, 1);
        alert("Película eliminada");
      } else {
        alert("Índice inválido");
      }
    }
  </script>
</body>
</html>
